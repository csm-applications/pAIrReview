<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/public">
  <title>Redirecionando...</title>
  <script>
    // Caso o meta refresh não funcione, o JS garante o redirecionamento
    window.onload = function() {
      window.location.href = "/public";
    };
  </script>
</head>
<body>
  <p>Redirecionando para <a href="/public">/public</a>...</p>
</body>
</html>
